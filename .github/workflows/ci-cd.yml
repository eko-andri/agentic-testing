name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Install Dependencies
        working-directory: server
        run: npm install

      - name: Run Playwright Tests
        working-directory: server
        run: npx playwright test

      # Step to run Agent Tests is disabled for now
      # - name: Run Agent Tests
      #   run: node server/e2e-pipeline/orchestrator.js
